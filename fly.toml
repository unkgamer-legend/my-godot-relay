app = 'my-godot-relay'
primary_region = 'ewr'

[build]

[env]
  PORT = '8080'

[[services]]
  internal_port = 8080
  protocol = 'tcp'
  auto_start_machines = true
  min_machines_running = 0

  # This opens the "Front Door" on port 80
  [[services.ports]]
    port = 80
    handlers = ["http"]

  # This opens the "Front Door" on port 443 (for secure connections)
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
